<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#303734" />
    <title>Compare Methods · Berlin Real Estate Sim</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app compare-app">
      <header class="topbar">
        <div>
          <h1>
            <span
              class="info"
              tabindex="0"
              data-tooltip="Compare different simulation methods under the same external policy and influence settings."
            >Method Comparison</span>
          </h1>
          <p
            class="info"
            tabindex="0"
            data-tooltip="Every method receives the same initial scenario, same policy levers, same step count, and same influence toggle."
          >Shared external influences</p>
        </div>
        <div class="run-controls" aria-label="comparison controls">
          <a class="nav-link" href="index.html">Game</a>
          <a class="nav-link" href="wiki.html">Wiki</a>
          <a class="nav-link" href="notes.html">Notes</a>
          <a class="nav-link" href="docs.html">Docs</a>
          <button id="compareRunBtn" type="button">Run</button>
          <button id="compareResetBtn" type="button">Reset</button>
        </div>
      </header>

      <section class="compare-layout">
        <aside class="panel controls-panel" aria-label="shared external controls">
          <h2>
            <span
              class="info"
              tabindex="0"
              data-tooltip="These settings are applied to every method, so differences come from the method logic rather than different inputs."
            >Shared Inputs</span>
          </h2>
          <label>
            <span
              class="info"
              tabindex="0"
              data-tooltip="How many simulation updates each method runs. For Markov and MCMC methods, one step means one state transition or sample."
            >Steps</span>
            <input id="compareStepsControl" type="range" min="4" max="60" value="24" />
            <output id="compareStepsValue">24</output>
          </label>
          <label>
            <span
              class="info"
              tabindex="0"
              data-tooltip="A fixed number that makes random methods repeatable, so the same settings can be compared again."
            >Random seed</span>
            <input id="compareSeedControl" type="number" min="1" max="999999" value="19" />
          </label>
          <label>
            <span
              class="info"
              tabindex="0"
              data-tooltip="Higher values slow rent growth, especially for regulated units and public-stabilized regimes."
            >Rent regulation</span>
            <input id="compareRentControl" type="range" min="0" max="100" value="55" />
            <output id="compareRentValue">55%</output>
          </label>
          <label>
            <span
              class="info"
              tabindex="0"
              data-tooltip="Represents pressure against leaving homes empty. Higher values reduce persistent vacancy in the aggregate model."
            >Vacancy enforcement</span>
            <input id="compareVacancyControl" type="range" min="0" max="100" value="40" />
            <output id="compareVacancyValue">40%</output>
          </label>
          <label>
            <span
              class="info"
              tabindex="0"
              data-tooltip="Represents public or social ownership expansion. Higher values dampen speculative sale-price pressure."
            >Public acquisition</span>
            <input id="comparePublicControl" type="range" min="0" max="100" value="20" />
            <output id="comparePublicValue">20%</output>
          </label>
          <label>
            <span
              class="info"
              tabindex="0"
              data-tooltip="External purchase and redevelopment demand. Higher values raise demand pressure and spillover intensity."
            >Investor pressure</span>
            <input id="compareInvestorControl" type="range" min="0" max="100" value="68" />
            <output id="compareInvestorValue">68%</output>
          </label>
          <label class="toggle-row">
            <span
              class="info"
              tabindex="0"
              data-tooltip="Turns neighborhood spillovers on or off, such as office-belt pressure affecting nearby housing areas."
            >Area influences</span>
            <input id="compareInfluenceControl" type="checkbox" checked />
          </label>
          <h2>
            <span
              class="info"
              tabindex="0"
              data-tooltip="Targets are reference values used to calculate error. Edit them before real data import, then save them as JSON."
            >Calibration Targets</span>
          </h2>
          <label>
            <span
              class="info"
              tabindex="0"
              data-tooltip="Target median monthly rent per square meter. The methods try to get close to this reference value."
            >Rent / sqm</span>
            <input id="targetRentControl" type="number" min="0" step="0.1" value="18.5" />
          </label>
          <label>
            <span
              class="info"
              tabindex="0"
              data-tooltip="Target median purchase price per square meter for apartments or similar units."
            >Sale / sqm</span>
            <input id="targetSaleControl" type="number" min="0" step="100" value="7600" />
          </label>
          <label>
            <span
              class="info"
              tabindex="0"
              data-tooltip="Target share of units that are empty or unavailable for an occupied household."
            >Vacancy %</span>
            <input id="targetVacancyControl" type="number" min="0" max="100" step="1" value="6" />
          </label>
          <label>
            <span
              class="info"
              tabindex="0"
              data-tooltip="Target average displacement stress. Zero means stable households; one hundred means severe pressure."
            >Stress %</span>
            <input id="targetStressControl" type="number" min="0" max="100" step="1" value="28" />
          </label>
          <label>
            <span
              class="info"
              tabindex="0"
              data-tooltip="Target average share of monthly household income spent on rent."
            >Rent burden %</span>
            <input id="targetBurdenControl" type="number" min="0" max="100" step="1" value="32" />
          </label>
          <label>
            <span
              class="info"
              tabindex="0"
              data-tooltip="Target purchase-price-to-income ratio, expressed as years of average individual income."
            >Buy years</span>
            <input id="targetBuyYearsControl" type="number" min="0" step="0.5" value="18" />
          </label>
          <button id="saveTargetsBtn" type="button">Save targets JSON</button>
        </aside>

        <section class="comparison-surface">
          <section id="comparisonCards" class="comparison-cards" aria-label="method comparison summary"></section>
          <section class="chart-panel compare-chart-panel" aria-label="comparison charts">
            <div>
              <div class="section-heading">
                <h2>
                  <span
                    class="info"
                    tabindex="0"
                    data-tooltip="Shows each method's rent path on a normalized scale, so different methods can be compared by direction and volatility."
                  >Rent Signal</span>
                </h2>
                <span>normalized median rent per sqm</span>
              </div>
              <canvas id="compareRentChart" width="900" height="240"></canvas>
            </div>
            <div>
              <div class="section-heading">
                <h2>
                  <span
                    class="info"
                    tabindex="0"
                    data-tooltip="Shows displacement stress as solid lines and vacancy as dashed lines, using the same color for each method."
                  >Risk Signal</span>
                </h2>
                <span>vacancy and stress</span>
              </div>
              <canvas id="compareRiskChart" width="900" height="240"></canvas>
            </div>
          </section>
        </section>
      </section>
    </main>

    <script src="scenario-content.js"></script>
    <script src="scenario.js"></script>
    <script src="compare.js"></script>
  </body>
</html>
