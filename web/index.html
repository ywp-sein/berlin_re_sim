<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Berlin Real Estate Sim</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div>
          <h1>
            <span
              class="info"
              tabindex="0"
              data-tooltip="A small game prototype for exploring how rent, purchase prices, vacancy, ownership, and policy interact in Berlin housing."
            >Berlin Real Estate Sim</span>
          </h1>
          <p
            class="info"
            tabindex="0"
            data-tooltip="The first scenario focuses on Mitte. More districts can be added later with the same data structure."
          >Mitte prototype</p>
        </div>
        <div class="run-controls" aria-label="simulation controls">
          <button id="stepBtn" type="button" title="Advance one month">Step</button>
          <button id="playBtn" type="button" title="Run or pause the simulation">Play</button>
          <button id="resetBtn" type="button" title="Reset scenario">Reset</button>
        </div>
      </header>

      <section class="metrics" aria-label="market metrics">
        <article>
          <span class="info" tabindex="0" data-tooltip="Each step advances the simulation by one month.">Month</span>
          <strong id="monthMetric">0</strong>
        </article>
        <article>
          <span
            class="info"
            tabindex="0"
            data-tooltip="The middle rent per square meter across all simulated units. This shows rental pressure without being dominated by one extreme unit."
          >Median rent</span>
          <strong id="rentMetric">-</strong>
        </article>
        <article>
          <span
            class="info"
            tabindex="0"
            data-tooltip="The middle estimated purchase price per square meter. This tracks the ownership and investor side of the market."
          >Median sale</span>
          <strong id="saleMetric">-</strong>
        </article>
        <article>
          <span
            class="info"
            tabindex="0"
            data-tooltip="The share of units currently empty. Vacancy can represent transition, speculation, enforcement gaps, or unaffordable supply."
          >Vacancy</span>
          <strong id="vacancyMetric">-</strong>
        </article>
        <article>
          <span
            class="info"
            tabindex="0"
            data-tooltip="Average household displacement stress. It rises when rent burden exceeds what households can tolerate."
          >Stress</span>
          <strong id="stressMetric">-</strong>
        </article>
      </section>

      <section class="workspace">
        <aside class="panel controls-panel" aria-label="policy levers">
          <h2>
            <span
              class="info"
              tabindex="0"
              data-tooltip="Change these levers to test how regulation, enforcement, public ownership, and investment pressure alter the market."
            >Policy Levers</span>
          </h2>
          <label>
            <span
              class="info"
              tabindex="0"
              data-tooltip="Higher values slow rent increases, especially for regulated units. This can reduce stress but may shift owner incentives."
            >Rent regulation</span>
            <input id="rentControl" type="range" min="0" max="100" value="55" />
            <output id="rentControlValue">55%</output>
          </label>
          <label>
            <span
              class="info"
              tabindex="0"
              data-tooltip="Higher values make it more likely that vacant units return to rental supply."
            >Vacancy enforcement</span>
            <input id="vacancyControl" type="range" min="0" max="100" value="40" />
            <output id="vacancyControlValue">40%</output>
          </label>
          <label>
            <span
              class="info"
              tabindex="0"
              data-tooltip="Represents public or social ownership pressure. Higher values soften local demand pressure and speculative growth."
            >Public acquisition</span>
            <input id="publicControl" type="range" min="0" max="100" value="20" />
            <output id="publicControlValue">20%</output>
          </label>
          <label>
            <span
              class="info"
              tabindex="0"
              data-tooltip="Higher values increase purchase-price growth and make rental-to-sale conversion more attractive to profit-seeking owners."
            >Investor pressure</span>
            <input id="investorControl" type="range" min="0" max="100" value="68" />
            <output id="investorControlValue">68%</output>
          </label>
        </aside>

        <section class="map-panel" aria-label="neighborhood map">
          <div class="section-heading">
            <h2>
              <span
                class="info"
                tabindex="0"
                data-tooltip="Each tile is a simplified Mitte sub-area. The red fill shows demand pressure."
              >Mitte Areas</span>
            </h2>
            <span id="selectedName">Alexanderplatz</span>
          </div>
          <div id="mapGrid" class="map-grid"></div>
        </section>

        <section class="panel detail-panel" aria-label="selected neighborhood details">
          <h2>
            <span
              class="info"
              tabindex="0"
              data-tooltip="Local values for the selected area, including rent, sale price, vacancy, and tenant stress."
            >Area Details</span>
          </h2>
          <dl id="areaDetails"></dl>
          <div class="unit-list" id="unitList"></div>
        </section>
      </section>

      <section class="chart-panel" aria-label="simulation charts">
        <div>
          <div class="section-heading">
            <h2>
              <span
                class="info"
                tabindex="0"
                data-tooltip="The chart compares normalized trends, so rent and sale prices show direction rather than exact euro values."
              >Market Signals</span>
            </h2>
            <span
              class="info"
              tabindex="0"
              data-tooltip="Green is rent, blue is sale price, yellow is vacancy, red is displacement stress."
            >rent, sale, vacancy, stress</span>
          </div>
          <canvas id="marketChart" width="900" height="260"></canvas>
        </div>
        <div class="event-log">
          <div class="section-heading">
            <h2>
              <span
                class="info"
                tabindex="0"
                data-tooltip="Events explain why the model changed, such as displacement, vacancy enforcement, or conversion toward sale."
              >Events</span>
            </h2>
            <span
              id="eventCount"
              class="info"
              tabindex="0"
              data-tooltip="Number of logged simulation events."
            >0</span>
          </div>
          <ol id="eventLog"></ol>
        </div>
      </section>
    </main>

    <script src="game.js"></script>
  </body>
</html>
