<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#303734" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Berlin RE Sim" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Berlin Real Estate Sim</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div>
          <h1>
            <span
              class="info"
              tabindex="0"
              data-tooltip="A small game prototype for exploring how rent, purchase prices, vacancy, ownership, and policy interact in Berlin housing."
            >Berlin Real Estate Sim</span>
          </h1>
          <p
            class="info"
            tabindex="0"
            data-tooltip="The first scenario focuses on Mitte. More districts can be added later with the same data structure."
          >Mitte prototype</p>
        </div>
        <div class="run-controls" aria-label="simulation controls">
          <a class="nav-link" href="compare.html">Compare</a>
          <a class="nav-link" href="wiki.html">Wiki</a>
          <button id="stepBtn" type="button" title="Advance one simulation step">Step</button>
          <button id="playBtn" type="button" title="Run or pause the simulation">Play</button>
          <button id="resetBtn" type="button" title="Reset scenario">Reset</button>
        </div>
      </header>

      <section class="metrics" aria-label="market metrics">
        <article>
          <span
            class="info"
            tabindex="0"
            data-tooltip="Shared comparison axis. In ABM it means a simulated month; in Markov it means a state transition; in MCMC it means a sample iteration."
          >Step</span>
          <strong id="monthMetric">0</strong>
        </article>
        <article>
          <span
            class="info"
            tabindex="0"
            data-tooltip="What one step means for the selected simulation method."
          >Step meaning</span>
          <strong id="stepMeaningMetric">Month</strong>
        </article>
        <article>
          <span
            class="info"
            tabindex="0"
            data-tooltip="The middle rent per square meter across all simulated units. This shows rental pressure without being dominated by one extreme unit."
          >Median rent</span>
          <strong id="rentMetric">-</strong>
        </article>
        <article>
          <span
            class="info"
            tabindex="0"
            data-tooltip="The middle estimated purchase price per square meter. This tracks the ownership and investor side of the market."
          >Median sale</span>
          <strong id="saleMetric">-</strong>
        </article>
        <article>
          <span
            class="info"
            tabindex="0"
            data-tooltip="The share of units currently empty. Vacancy can represent transition, speculation, enforcement gaps, or unaffordable supply."
          >Vacancy</span>
          <strong id="vacancyMetric">-</strong>
        </article>
        <article>
          <span
            class="info"
            tabindex="0"
            data-tooltip="Average household displacement stress. It rises when rent burden exceeds what households can tolerate."
          >Stress</span>
          <strong id="stressMetric">-</strong>
        </article>
        <article>
          <span
            class="info"
            tabindex="0"
            data-tooltip="Average monthly income per person, calculated as household income divided by household size."
          >Avg income/person</span>
          <strong id="incomeMetric">-</strong>
        </article>
        <article>
          <span
            class="info"
            tabindex="0"
            data-tooltip="Average rent burden across occupied units: monthly rent divided by monthly household income."
          >Rent burden</span>
          <strong id="burdenMetric">-</strong>
        </article>
        <article>
          <span
            class="info"
            tabindex="0"
            data-tooltip="Median purchase price compared with annual average individual income. Higher values mean buying is less reachable."
          >Buy years</span>
          <strong id="buyYearsMetric">-</strong>
        </article>
      </section>

      <section class="workspace">
        <aside class="panel controls-panel" aria-label="policy levers">
          <h2>
            <span
              class="info"
              tabindex="0"
              data-tooltip="Change these levers to test how regulation, enforcement, public ownership, and investment pressure alter the market."
            >Policy Levers</span>
          </h2>
          <label>
            <span
              class="info"
              tabindex="0"
              data-tooltip="Choose the simulation method. Agent-based follows unit and household rules; Markov chain samples market regimes from a transition matrix."
            >Method</span>
            <select id="methodControl">
              <option value="agent_based">Agent-based</option>
              <option value="analytical">Analytical baseline</option>
              <option value="markov_chain">Markov chain</option>
              <option value="mcmc_state">MCMC state sampler</option>
            </select>
          </label>
          <p id="methodDescription" class="method-description"></p>
          <label>
            <span
              class="info"
              tabindex="0"
              data-tooltip="Higher values slow rent increases, especially for regulated units. This can reduce stress but may shift owner incentives."
            >Rent regulation</span>
            <input id="rentControl" type="range" min="0" max="100" value="55" />
            <output id="rentControlValue">55%</output>
          </label>
          <label>
            <span
              class="info"
              tabindex="0"
              data-tooltip="Higher values make it more likely that vacant units return to rental supply."
            >Vacancy enforcement</span>
            <input id="vacancyControl" type="range" min="0" max="100" value="40" />
            <output id="vacancyControlValue">40%</output>
          </label>
          <label>
            <span
              class="info"
              tabindex="0"
              data-tooltip="Represents public or social ownership pressure. Higher values soften local demand pressure and speculative growth."
            >Public acquisition</span>
            <input id="publicControl" type="range" min="0" max="100" value="20" />
            <output id="publicControlValue">20%</output>
          </label>
          <label>
            <span
              class="info"
              tabindex="0"
              data-tooltip="Higher values increase purchase-price growth and make rental-to-sale conversion more attractive to profit-seeking owners."
            >Investor pressure</span>
            <input id="investorControl" type="range" min="0" max="100" value="68" />
            <output id="investorControlValue">68%</output>
          </label>
          <label class="toggle-row">
            <span
              class="info"
              tabindex="0"
              data-tooltip="Show directed area-to-area influence arrows. Thicker arrows mean stronger spillover pressure between areas."
            >Area influences</span>
            <input id="influenceControl" type="checkbox" checked />
          </label>
        </aside>

        <section class="map-panel" aria-label="neighborhood map">
          <div class="section-heading">
            <h2>
              <span
                class="info"
                tabindex="0"
                data-tooltip="A stylized Mitte map. Each labeled shape is clickable, and warmer color means higher demand pressure."
              >Mitte Areas</span>
            </h2>
            <span id="selectedName">Alexanderplatz</span>
          </div>
          <div id="mapGrid" class="map-canvas"></div>
        </section>

        <section class="panel detail-panel" aria-label="selected neighborhood details">
          <h2>
            <span
              class="info"
              tabindex="0"
              data-tooltip="Local values for the selected area, including rent, sale price, vacancy, and tenant stress."
            >Area Details</span>
          </h2>
          <dl id="areaDetails"></dl>
          <div class="unit-list" id="unitList"></div>
        </section>
      </section>

      <section class="chart-panel" aria-label="simulation charts">
        <div>
          <div class="section-heading">
            <h2>
              <span
                class="info"
                tabindex="0"
                data-tooltip="The chart compares normalized trends, so rent and sale prices show direction rather than exact euro values."
              >Market Signals</span>
            </h2>
            <span
              class="info"
              tabindex="0"
              data-tooltip="Green is rent, blue is sale price, yellow is vacancy, red is displacement stress."
            >rent, sale, vacancy, stress</span>
          </div>
          <div class="chart-tools" aria-label="market signal display options">
            <label>
              <span
                class="info"
                tabindex="0"
                data-tooltip="Overall compresses the full timeline into the visible chart. Time-series scroll gives each step fixed horizontal space and scrolls to the latest step."
              >Display</span>
              <select id="chartModeControl">
                <option value="overall">Overall</option>
                <option value="time_series">Time-series scroll</option>
              </select>
            </label>
          </div>
          <div id="chartViewport" class="chart-viewport">
            <canvas id="marketChart" width="900" height="260"></canvas>
          </div>
        </div>
        <div class="event-log">
          <div class="section-heading">
            <h2>
              <span
                class="info"
                tabindex="0"
                data-tooltip="Events explain why the model changed, such as displacement, vacancy enforcement, or conversion toward sale."
              >Events</span>
            </h2>
            <span
              id="eventCount"
              class="info"
              tabindex="0"
              data-tooltip="Number of logged simulation events."
            >0</span>
          </div>
          <ol id="eventLog"></ol>
        </div>
      </section>
    </main>

    <script src="game.js"></script>
    <script>
      if ("serviceWorker" in navigator && location.protocol !== "file:") {
        navigator.serviceWorker.register("service-worker.js");
      }
    </script>
  </body>
</html>
