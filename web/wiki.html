<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#303734" />
    <title>Dictionary · Berlin Real Estate Sim</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app wiki-app">
      <header class="topbar">
        <div>
          <h1>
            <span
              class="info"
              tabindex="0"
              data-tooltip="A searchable dictionary for model terms, real estate concepts, implementation choices, and project documentation."
            >Dictionary Wiki</span>
          </h1>
          <p
            class="info"
            tabindex="0"
            data-tooltip="Use this page when a label in the game is too short and you want the longer reasoning or related docs."
          >terminology, implementation notes, and docs</p>
        </div>
        <div class="run-controls" aria-label="wiki navigation">
          <a class="nav-link" href="index.html">Game</a>
          <a class="nav-link" href="compare.html">Compare</a>
          <a class="nav-link" href="notes.html">Notes</a>
          <a class="nav-link" href="docs.html">Docs</a>
        </div>
      </header>

      <section class="wiki-layout">
        <aside class="panel wiki-search-panel" aria-label="dictionary search">
          <h2>
            <span
              class="info"
              tabindex="0"
              data-tooltip="Search is local to this page and works offline. It searches terms, summaries, docs, details, categories, and tags."
            >Search</span>
          </h2>
          <label class="wiki-search-box">
            <span>Term or concept</span>
            <input
              id="wikiSearch"
              type="search"
              autocomplete="off"
              placeholder="Try RMSE, MCMC, vacancy, purchase..."
            />
          </label>
          <label>
            <span>Category</span>
            <select id="wikiCategory">
              <option value="all">All categories</option>
            </select>
          </label>
          <p id="wikiCount" class="wiki-count">0 entries</p>
        </aside>

        <section class="wiki-content" aria-label="dictionary entries">
          <div class="section-heading">
            <h2>
              <span
                class="info"
                tabindex="0"
                data-tooltip="Entries explain both the modeling idea and where it appears in the current prototype."
              >Entries</span>
            </h2>
            <span id="wikiActiveFilter">all concepts</span>
          </div>
          <div id="wikiResults" class="wiki-results"></div>
        </section>
      </section>
    </main>

    <script src="docs-content.js"></script>
    <script src="wiki.js"></script>
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [["\\(", "\\)"]],
          displayMath: [["\\[", "\\]"]],
        },
        svg: {
          fontCache: "global",
        },
      };
    </script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"
    ></script>
    <script>
      if ("serviceWorker" in navigator && location.protocol !== "file:") {
        navigator.serviceWorker.register("service-worker.js");
      }
    </script>
  </body>
</html>
