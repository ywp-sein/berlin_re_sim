[project]
name = "berlin-re-sim"
version = "0.1.0"
description = "A minimal Mesa prototype for simulating Berlin real estate dynamics."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mesa>=3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
